server.address=0.0.0.0
server.port=8081

#Database Configuration
spring.datasource.url=jdbc:mysql://root:fqBrUQuqUdDyYXtNbEAdaqTmbQsMWnxB@altaria.proxy.rlwy.net:51386/railway
spring.datasource.username=root
spring.datasource.password=fqBrUQuqUdDyYXtNbEAdaqTmbQsMWnxB
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool (scales DB connections for 10L users)
spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=20000

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# ⚠️ PRODUCTION: Use 'validate' — 'update' can silently alter/drop columns on deploy
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Flyway Migration Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Disable Spring Batch auto-run
spring.batch.job.enabled=false

# Email Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${EMAIL_USERNAME:rsangadi1970@gmail.com}
# ⚠ Set EMAIL_PASSWORD env variable — do NOT hardcode real password here
spring.mail.password=${EMAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# JWT Configuration
# ⚠️ JWT_SECRET must be set as an environment variable — NO hardcoded default.
# Minimum 32 characters. If not set, the app will fail with a clear error.
# Generate a strong secret: openssl rand -hex 32
jwt.secret=${JWT_SECRET : myLocalDevSecretKey12345678901234567890}
jwt.access-token-expiry-ms=2592000000
# jwt.refresh-token-expiry-ms=2592000000

# Redis Configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
redis.enabled=${REDIS_ENABLED:false}

# MSG91 SMS OTP Configuration
# Sign up at https://msg91.com to get your credentials
msg91.auth-key=${MSG91_AUTH_KEY:}
msg91.template-id=${MSG91_TEMPLATE_ID:}
msg91.sender-id=${MSG91_SENDER_ID:NMKHTA}
msg91.otp-length=6
msg91.otp-expiry-minutes=5
# ⚠ IMPORTANT: Keep msg91.enabled=false locally. Set MSG91_ENABLED=true ONLY in production
# with valid MSG91_AUTH_KEY and MSG91_TEMPLATE_ID environment variables.
# If enabled=true but keys are missing, the app will FAIL TO START (intentional fail-fast).
msg91.enabled=${MSG91_ENABLED:false}
msg91.enabled=${MSG91_ENABLED:false}

# File upload settings
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
