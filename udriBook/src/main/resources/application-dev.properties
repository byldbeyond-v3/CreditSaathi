# ============================================================
# application-dev.properties — LOCAL DEVELOPMENT OVERRIDES
# ============================================================
# Activate with: --spring.profiles.active=dev
# Or set env var: SPRING_PROFILES_ACTIVE=dev
#
# This file provides safe defaults for local development.
# NEVER commit real credentials here. NEVER use in production.
# ============================================================

# Local DB (override production env-var requirement)
spring.datasource.url=jdbc:mysql://localhost:3306/my_khata
spring.datasource.username=root
spring.datasource.password=danu763

# Allow Hibernate to update schema locally (safe for dev, NEVER in prod)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT — dev-only secret (NOT secure, only for local testing)
# Production MUST set JWT_SECRET env var with a strong random secret
jwt.secret=dev-only-secret-change-this-in-production-min-32-chars!!

# Email — disable real sending in dev (use console logger or MailHog)
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=dev@localhost
spring.mail.password=

# MSG91 — always disabled in dev (use Redis OTP fallback)
msg91.enabled=false

# Redis — local Redis (no password)
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=
redis.enabled=false

# Show actuator endpoints in dev
management.endpoints.web.exposure.include=health,metrics,info
